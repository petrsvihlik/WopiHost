name: E2E (Collabora)

# End-to-end check against the full distributed app with a real Collabora container in the
# loop. Spins up the AppHost via Aspire.Hosting.Testing, drives the Web frontend with
# Playwright + Chromium, opens a .docx in Collabora and validates the WOPI handshake + save
# round-trip. Tracking: https://github.com/petrsvihlik/WopiHost/issues/357 Approach B.
#
# NOT a per-PR gate. The Collabora flow is by design flakier than the unit / smoke suites
# (canvas-based editor, WebSocket handshake, container cold-start), and gating PRs on it
# would cause more friction than it'd catch. Runs nightly to catch upstream regressions
# (Collabora image drift, CODE UI changes) and workflow_dispatch for ad-hoc verification.
#
# Linux-only because Collabora ships Linux containers and ubuntu-latest is the only
# GitHub-hosted runner that runs them without nested-virtualisation gymnastics.

on:
  workflow_dispatch:
  schedule:
    # 03:17 UTC nightly. Off-the-hour so we're not competing with every other "0 3 * * *"
    # cron in the world for shared GitHub Actions capacity.
    - cron: '17 3 * * *'

permissions:
  contents: read

# One run at a time. Nothing is cancelled: every commit, release and scheduled run is
# wanted on its own, so overlapping runs queue rather than supersede each other.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  e2e:
    name: Collabora end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30 # Generous: Collabora image pull on a clean cache + Playwright install.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Set Cobalt packages token
        run: echo "COBALT_PACKAGES_TOKEN=${{ secrets.COBALT_PACKAGES_TOKEN }}" >> $GITHUB_ENV

      - name: Restore
        run: dotnet restore test/WopiHost.E2ETests/WopiHost.E2ETests.csproj

      - name: Build
        run: dotnet build test/WopiHost.E2ETests/WopiHost.E2ETests.csproj --no-restore /p:ContinuousIntegrationBuild=true

      - name: Install Playwright browsers
        # Locate the generated helper instead of hardcoding a path: the literal encoded the
        # artifacts layout, the project name and the *Debug* configuration at once, so a lane
        # building Release would silently get a wrong path. --with-deps installs the apt packages
        # Chromium needs on a fresh runner. Installing a browser is per-runner, so whichever
        # project's copy of the script is found will do. Idempotent — caches in ~/.cache.
        shell: bash
        run: |
          set -euo pipefail
          script="$(find artifacts/bin -name playwright.ps1 -print -quit)"
          if [[ -z "$script" ]]; then
            echo "::error::No playwright.ps1 found under artifacts/bin — the build output moved, or Playwright is no longer referenced."
            exit 1
          fi
          pwsh "$script" install --with-deps chromium

      - name: Pre-pull Collabora image
        # Pre-pulling outside the test makes the test's WaitForResourceHealthyAsync timeout
        # bound the runtime cost rather than the image-pull cost. CODE's tag floats, so pin
        # the same image string the AppHost uses (collabora/code) — Aspire defaults to :latest
        # when no tag is supplied.
        run: docker pull collabora/code:latest

      - name: Run e2e
        # -p:TestingPlatformCommandLineArguments= clears the repo-wide default set in
        # Directory.Build.props, which filters out Category=E2E so per-PR `dotnet test` skips
        # this project. The dedicated workflow undoes that and then picks its suite with the
        # Client trait. Clearing the property also drops the default --ignore-exit-code 8,
        # which is what we want here: if the Client filter matches nothing, this workflow
        # should fail rather than report a vacuous pass.
        run: dotnet test --project test/WopiHost.E2ETests/WopiHost.E2ETests.csproj --no-build -p:TestingPlatformCommandLineArguments= --filter-trait "Client=Collabora" --output Detailed

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-traces
          path: |
            artifacts/bin/WopiHost.E2ETests/**/test-results/**
            artifacts/bin/WopiHost.E2ETests/**/playwright-report/**
          if-no-files-found: ignore
