name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
      - 'LICENSE'
      - '.claude/**'

# Supersede an in-flight run for the same PR rather than letting both finish: the two
# race to write the same sticky comments and check statuses, and the loser can be the
# newer one. Runs on master, releases and schedules are never cancelled — each commit's
# result is wanted on its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Internal, human-authored PRs only.
    #
    # Fork PRs: the Claude GitHub App's OIDC token exchange doesn't work in the secret-less
    # fork-PR context — review one manually by commenting `@claude review this` (claude.yml).
    #
    # Bot PRs: the action refuses a non-human initiator unless the bot is listed in
    # allowed_bots, and it reads the initiator from the event payload, so a re-run replays
    # the same refusal — the failure is not transient. continue-on-error keeps the check
    # green, which is why this surfaced only as annotations on every baseline-bump and
    # Dependabot PR. Those PRs are a version-string change and an auto-merge; skipping the
    # job outright beats paying for a review nobody reads.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        # Informational: a reviewer hiccup never fails the PR's checks.
        continue-on-error: true
        uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The code-review plugin owns the structured review + posting (buffered inline
          # comments + summary) and reads CLAUDE.md for repo conventions. A freeform prompt
          # was tried first and posted nothing ("No buffered inline comments").
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
