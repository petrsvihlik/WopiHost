name: Publish to NuGet

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write # Required for OIDC

# One run at a time. Nothing is cancelled: every commit, release and scheduled run is
# wanted on its own, so overlapping runs queue rather than supersede each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Setup .NET
      uses: ./.github/actions/setup-dotnet-sdk
    - name: Extract version from tag
      id: get_version
      run: |
        REF="${GITHUB_REF#refs/tags/}"
        echo "version-without-v=${REF#v}" >> $GITHUB_OUTPUT
    - name: Set Cobalt packages token
      run: echo "COBALT_PACKAGES_TOKEN=${{ secrets.COBALT_PACKAGES_TOKEN }}" >> $GITHUB_ENV
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore --configuration Release /p:ContinuousIntegrationBuild=true /p:Version="${{ steps.get_version.outputs.version-without-v }}"
    - name: Install Playwright browsers (for sample-app smoke tests)
      uses: ./.github/actions/install-playwright-browsers
    - name: Pre-pull Testcontainers images
      uses: ./.github/actions/prepull-testcontainers-images
    - name: Test and publish coverage
      uses: ./.github/actions/test-and-report
      with:
        results-directory: ${{ github.workspace }}/test-results
        codecov-token: ${{ secrets.CODECOV_TOKEN }}
        configuration: Release
        # The CI lane already reported this commit's test results.
        report-test-results: 'false'
        # ...and already measured this commit's coverage, in Debug. Uploading a second report
        # built in Release makes Codecov merge two configurations into one commit's totals,
        # inflating its coverable-line count and charging the difference to the next PR based
        # on it. Tests still run here as a release gate; only the upload is dropped.
        publish-coverage: 'false'
    - name: Pack
      # Output is centralized via UseArtifactsOutput (see Directory.Build.props);
      # nupkg/snupkg files land in artifacts/package/release/.
      run: dotnet pack --no-build --include-symbols --verbosity normal --configuration Release /p:PackageVersion="${{ steps.get_version.outputs.version-without-v }}"
    - name: Upload artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: "NuGet packages"
        path: artifacts/package/release
    - name: Publish artifacts to NuGet.org
      run: dotnet nuget push 'artifacts/package/release/*.nupkg' -s https://api.nuget.org/v3/index.json -k ${NUGET_API_KEY} --skip-duplicate
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    - name: Upload artifacts to the GitHub release
      uses: Roang-zero1/github-upload-release-artifacts-action@87271b3f8dca9feb9e9d44381fddd2db7f09d6e1 # v3
      with:
        args: artifacts/package/release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

